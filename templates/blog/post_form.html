{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-5" style="max-width:760px;">
    <h1 class="section-title mb-4">{{ title }}</h1>
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-gradient btn-lg w-100 mt-3"><i class="bi bi-check2-circle"></i> Saqlash</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
