{% extends "base.html" %}
{% block content %}
<div class="container my-5">
    <h1 class="section-title mb-4">Barcha kategoriyalar</h1>
    <div class="row g-4">
        {% for cat in categories %}
        <div class="col-md-4 col-lg-3">
            <a href="{{ cat.get_absolute_url }}" class="text-decoration-none">
                <div class="card border-0 shadow-sm h-100 hover-lift">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-folder-fill display-5 text-gradient"></i>
                        <h6 class="mt-2 link-dark">{{ cat.name }}</h6>
                        <p class="small text-muted mb-0">{{ cat.post_count }} maqola</p>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
