{% extends "base.html" %}
{% block content %}
<div class="container my-5" style="max-width:600px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body text-center p-5">
            <i class="bi bi-exclamation-triangle text-warning display-4"></i>
            <h3 class="mt-3">Maqolani o'chirmoqchimisiz?</h3>
            <p class="text-muted">"{{ post.title }}" — bu amalni qaytarib bo'lmaydi.</p>
            <form method="post" class="d-inline">
                {% csrf_token %}
                <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary">Bekor qilish</a>
                <button class="btn btn-danger"><i class="bi bi-trash"></i> Ha, o'chirish</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
