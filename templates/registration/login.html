{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container my-5" style="max-width:440px;">
    <div class="card border-0 shadow-lg"><div class="card-body p-4">
        <div class="text-center mb-4">
            <i class="bi bi-box-arrow-in-right display-4 text-gradient"></i>
            <h3 class="mt-2">Kirish</h3>
            <p class="text-muted small">Hisobingizga kiring</p>
        </div>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button class="btn btn-gradient btn-lg w-100 mt-3">
                <i class="bi bi-box-arrow-in-right"></i> Kirish
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'password_reset' %}" class="text-decoration-none small">
                <i class="bi bi-key"></i> Parolni unutdingizmi?
            </a>
        </div>
        <hr class="my-3">
        <p class="text-center mb-0 small">
            Hisobingiz yo'qmi? <a href="{% url 'register' %}" class="text-gradient fw-bold">Ro'yxatdan o'tish</a>
        </p>
    </div></div>
</div>
{% endblock %}
