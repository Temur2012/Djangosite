{% extends "base.html" %}
{% block title %}Email yuborildi{% endblock %}

{% block content %}
<div class="container my-5" style="max-width:520px;">
    <div class="card border-0 shadow-lg text-center">
        <div class="card-body p-5">
            <i class="bi bi-envelope-check display-1 text-success"></i>
            <h2 class="mt-3">Email yuborildi! 📬</h2>
            <p class="text-muted">
                Agar siz kiritgan email manzilimiz bazada mavjud bo'lsa,
                <strong>parolni tiklash uchun havola</strong> yuborildi.
            </p>
            <p class="small text-muted">
                Xabarni ko'rmasangiz — <strong>"Spam"</strong> papkasini ham tekshiring.
            </p>
            <a href="{% url 'home' %}" class="btn btn-gradient mt-3">
                <i class="bi bi-house"></i> Bosh sahifa
            </a>
        </div>
    </div>
</div>
{% endblock %}
