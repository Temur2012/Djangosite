{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Parolni tiklash{% endblock %}

{% block content %}
<div class="container my-5" style="max-width:480px;">
    <div class="card border-0 shadow-lg">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-envelope-paper display-4 text-gradient"></i>
                <h3 class="mt-2">Parolni tiklash</h3>
                <p class="text-muted small">Email manzilingizni kiriting, sizga tiklash uchun havola yuboramiz.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-gradient btn-lg w-100 mt-3">
                    <i class="bi bi-send"></i> Email yuborish
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-decoration-none small">← Kirish sahifasiga qaytish</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
